timeframe: FiveMinutes
instruments:
  - symbol: BTC
strategy:
  name: sma_crossover
  params:
    fast: 10
    slow: 30
risk:
  position_size_pct: 0.05
  max_open_positions: 3
  max_positions_per_instrument: 1
  default_stop_loss_pct: 0.02
  default_take_profit_pct: 0.04
  daily_loss_limit_pct: 0.05
backtest:
  commission_pct: 0.001
  slippage_pct: 0.0005
  fill_price: close
